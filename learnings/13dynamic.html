<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            display:flex;
            border:2px solid black;
            width: 1000px;
            align-items: center;
            margin:5px;
        }

        .image img{
            width: 200px;

        }
        .image{position: relative;}

        h1{padding: 2px 0px;}

        .capsule{
            position:absolute;
            bottom:4px;
            z-index:10;
            right:5px;
            background:#242020;
            opacity:0.9;
            color:white;
            padding:3px;
            border-radius: 3px;
            font-size: 14px;

        }


        
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="13image.png">
                <div class="capsule">31:21</div>
            </div>
            <div class="text">
                <h1>Introduction to backend</h1>
                <p>CodewithHarry . 727k views . 2 months ago</p>
            </div>
        </div>
        
        
    </div>
    <script src="13dynamic.js"></script>
</body>
</html>
