<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child{
            background-color: aqua;
            border: 2px solid black;
            cursor: pointer;
            margin: 14px;
            padding: 14px;
        }

        .childcontainer{
            margin: 14px;
            padding: 14px;
            background-color: bisque;
        }

        .container{
            margin: 14px;
            padding: 14px;
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                I am a vhild
            </div>
        </section>
    </div>

    <script>
        document.querySelector(".child").addEventListener("contextmenu", ()=>{
            e.stopPropagation()
            alert("Child was clicked")
            
        })
        
        
        document.querySelector(".childContainer").addEventListener("contextmenu", ()=>{
            e.stopPropagation()
            alert("childcontainer was clicked")
        })
        
        
        document.querySelector(".container").addEventListener("contextmenu", ()=>{
            e.stopPropagation()
            alert("Container was clicked")
        })
        </script>

<!-- here if we cliick on child , childcontainer and container are alsoo clicked and this is called bubbling 
 if you dont want this stop the propogation eith e.stopPropagation()-->

</body>
</html>
